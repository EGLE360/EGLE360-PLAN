name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# Ein neuer Push ersetzt den laufenden Lauf desselben Branches, damit die Vorabversion immer den neuesten Stand hat.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generierte Theme-Dateien sind aktuell
        shell: bash
        run: |
          python tools/generate_theme.py
          git diff --exit-code -- src/Egle360.Desktop/Themes design/tokens.css

      - name: Build
        run: dotnet build EGLE360.PLAN.sln -c Release -warnaserror

      - name: Tests
        run: dotnet test EGLE360.PLAN.sln -c Release --no-build

      - name: Rauchtest mit Screenshots
        shell: pwsh
        run: |
          $exe = "src/Egle360.Desktop/bin/Release/net10.0-windows/EGLE360.PLAN.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--screenshots", "screenshots" -PassThru
          # Hängt die Anwendung, nach 10 Minuten abbrechen, damit die bis dahin erstellten Bilder trotzdem abgelegt werden.
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "Anwendung reagiert nach 10 Minuten nicht mehr (letztes Bild: $((Get-ChildItem screenshots -Filter *.png | Sort-Object LastWriteTime | Select-Object -Last 1).Name))" }
          if (Test-Path screenshots/error.txt) { Get-Content screenshots/error.txt }
          if ($p.ExitCode -ne 0) { throw "Anwendung endete mit Code $($p.ExitCode)" }
          $count = (Get-ChildItem screenshots -Filter *.png).Count
          if ($count -lt 4) { throw "Nur $count Screenshots erzeugt" }

      # Testversion: eigenständiges Paket mit eingebauter .NET-Laufzeit, startet ohne installierte Entwicklerwerkzeuge.
      - name: Windows-Paket erstellen
        shell: pwsh
        run: |
          dotnet publish src/Egle360.Desktop/Egle360.Desktop.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -o publish/EGLE360-PLAN
          Copy-Item docs/Testanleitung.md publish/EGLE360-PLAN/Testanleitung.md
          $p = Start-Process -FilePath publish/EGLE360-PLAN/EGLE360.PLAN.exe -ArgumentList "--screenshots", "publish-check" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "Paket reagiert nach 10 Minuten nicht mehr" }
          if ($p.ExitCode -ne 0) { throw "Veröffentlichtes Paket endete mit Code $($p.ExitCode)" }
          Compress-Archive -Path publish/EGLE360-PLAN -DestinationPath EGLE360-PLAN-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EGLE360-PLAN-win-x64
          path: EGLE360-PLAN-win-x64.zip

      # Feste Download-Adresse für Testende: die Vorabversion "testversion" wird bei jedem Lauf ersetzt.
      - name: Vorabversion aktualisieren
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete testversion --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create testversion EGLE360-PLAN-win-x64.zip --repo "${{ github.repository }}" \
            --target "${{ github.event.pull_request.head.sha }}" --prerelease \
            --title "Testversion (Entwicklungsstand)" \
            --notes "Automatisch gebaut aus ${{ github.head_ref }} (${{ github.event.pull_request.head.sha }}). ZIP entpacken und EGLE360.PLAN.exe starten. Anleitung: Testanleitung.md im Ordner."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      # Screenshots zusätzlich als eigener Branch, damit sie ohne Artefakt-Download auf GitHub sichtbar sind.
      - name: Screenshots im Branch ci-screenshots ablegen
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots für ${{ github.event.pull_request.head.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screenshots
